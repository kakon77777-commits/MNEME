name: Memory Markdown Profile

on:
  push:
    paths:
      - "src/**"
      - "schemas/**"
      - "profiles/**"
      - "fixtures/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/memory-markdown-profile.yml"
  pull_request:
    paths:
      - "src/**"
      - "schemas/**"
      - "profiles/**"
      - "fixtures/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/memory-markdown-profile.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned evidence history
        shell: python
        run: |
          import subprocess

          command = ["git", "fetch", "--no-tags"]
          shallow = subprocess.check_output([
              "git",
              "rev-parse",
              "--is-shallow-repository",
          ], text=True).strip()
          if shallow == "true":
              command.append("--unshallow")
          command.extend([
              "origin",
              "refs/heads/main:refs/heads/evidence-main",
              "refs/heads/feat/claude-global-memory-transition-v0.1:refs/heads/evidence-claude-candidate",
          ])
          subprocess.check_call(command)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Fresh Memory Core acceptance
        run: python scripts/validate_fresh_memory_core.py --output fresh-memory-core.json
      - name: Memory Markdown Profile acceptance
        run: python scripts/validate_memory_markdown_profile.py --output memory-markdown-profile.json
      - name: EveMiss Residence Profile v0.2 acceptance
        run: python scripts/validate_memory_markdown_profile_v02.py --output memory-markdown-profile-v02.json
      - name: Compile
        run: python -m compileall -q src
