name: Memory Markdown Profile

on:
  push:
    paths:
      - "src/**"
      - "schemas/**"
      - "profiles/**"
      - "fixtures/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/memory-markdown-profile.yml"
  pull_request:
    paths:
      - "src/**"
      - "schemas/**"
      - "profiles/**"
      - "fixtures/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/memory-markdown-profile.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Fresh Memory Core acceptance
        run: python scripts/validate_fresh_memory_core.py --output fresh-memory-core.json
      - name: Memory Markdown Profile acceptance
        run: python scripts/validate_memory_markdown_profile.py --output memory-markdown-profile.json
      - name: Compile
        run: python -m compileall -q src
