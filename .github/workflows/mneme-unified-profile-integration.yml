name: MNEME Unified Profile Integration

on:
  push:
    paths:
      - "src/**"
      - "profiles/**"
      - "fixtures/**"
      - "tests/**"
      - "scripts/**"
      - "docs/runtime/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/mneme-unified-profile-integration.yml"
  pull_request:
    paths:
      - "src/**"
      - "profiles/**"
      - "fixtures/**"
      - "tests/**"
      - "scripts/**"
      - "docs/runtime/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/mneme-unified-profile-integration.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development candidate
        run: python -m pip install -e ".[dev]"
      - name: Full tests
        run: python -B -m pytest -q -rs
      - name: Fresh Memory Core
        run: >-
          python -B scripts/validate_fresh_memory_core.py
          --output "${{ runner.temp }}/fresh-memory-core.json"
      - name: MNEME-MD 0.1
        run: >-
          python -B scripts/validate_memory_markdown_profile.py
          --output "${{ runner.temp }}/mneme-md-v01.json"
      - name: EveMiss profile 0.2
        run: >-
          python -B scripts/validate_memory_markdown_profile_v02.py
          --output "${{ runner.temp }}/evemiss-profile-v02.json"
      - name: MNEME-CPS 0.1
        run: >-
          python -B scripts/validate_cognitive_persistence_semantics.py
          --output "${{ runner.temp }}/mneme-cps-v01.json"
      - name: Private Residence Dry-Run 0.2
        run: >-
          python -B scripts/validate_private_residence_two_pass_dry_run.py
          --output "${{ runner.temp }}/private-residence-dry-run-v02.json"
      - name: Claude Global Transition 0.1
        run: >-
          python -B scripts/validate_claude_global_memory.py
          --root "${{ runner.temp }}/mneme-claude-global-root"
          --output "${{ runner.temp }}/claude-global-v01.json"
      - name: Clean wheel
        run: >-
          python -m pip wheel . --no-deps --no-build-isolation
          --wheel-dir "${{ runner.temp }}/wheelhouse"
      - name: Install exact wheel
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          wheelhouse = pathlib.Path(r"${{ runner.temp }}") / "wheelhouse"
          wheel = next(wheelhouse.glob("*.whl"))
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--no-deps",
              "--force-reinstall",
              str(wheel),
          ])
      - name: Installed CLI
        run: mneme-claude-global verify
      - name: Compile
        run: python -B -m compileall -q src tests
