name: Fresh Memory Core

on:
  push:
    branches:
      - workbench/v0.1-fresh-memory-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned evidence history
        shell: python
        run: |
          import subprocess

          command = ["git", "fetch", "--no-tags"]
          shallow = subprocess.check_output([
              "git",
              "rev-parse",
              "--is-shallow-repository",
          ], text=True).strip()
          if shallow == "true":
              command.append("--unshallow")
          command.extend([
              "origin",
              "refs/heads/main:refs/heads/evidence-main",
              "refs/heads/feat/claude-global-memory-transition-v0.1:refs/heads/evidence-claude-candidate",
          ])
          subprocess.check_call(command)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: python -m pytest -q

      - name: Acceptance
        run: python scripts/validate_fresh_memory_core.py --output fresh-memory-core.json

      - name: Compile
        run: python -m compileall -q src
