[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-memory"
version = "0.5.0a1"
description = "File-first canonical memory runtime for Residence-aware AI systems"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[project.scripts]
mneme-claude-global = "mneme.claude_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "setuptools>=68", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mneme = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
